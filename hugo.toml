baseURL = 'https://shcxyz.site/'
languageCode = 'zh-cn'
title = '阿辰的博客'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  
  # 站内访问统计（由 Nginx 访问日志聚合，不加载第三方脚本）
  siteStats = true

[params.footer]
  text = '[津ICP备2026004414号-1](https://beian.miit.gov.cn/)'

[params.assets]
  favicon = '/icons/chen-mark.svg'
  favicon16x16 = '/icons/chen-mark-16.png'
  favicon32x32 = '/icons/chen-mark-32.png'
  apple_touch_icon = '/icons/chen-mark-180.png'
  safari_pinned_tab = '/icons/chen-mask.svg'
  theme_color = '#4f46e5'
  msapplication_TileColor = '#4f46e5'
  
  # 评论系统 - Giscus (需要配置 GitHub 仓库)
  # 取消下面的注释并填入你的 GitHub 仓库信息
  # [params.giscus]
  #   repo = 'your-username/your-repo'
  #   repoId = 'your-repo-id'
  #   category = 'Announcements'
  #   categoryId = 'your-category-id'
  #   mapping = 'pathname'
  #   reactionsEnabled = 1
  #   emitMetadata = 0
  #   inputPosition = 'top'
  #   theme = 'preferred_color_scheme'
  #   lang = 'zh-CN'

