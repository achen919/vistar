baseURL = 'https://shcxyz.site/'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  
  # 不蒜子访问统计
  busuanzi = true
  
  # 评论系统 - Giscus (需要配置 GitHub 仓库)
  # 取消下面的注释并填入你的 GitHub 仓库信息
  # [params.giscus]
  #   repo = 'your-username/your-repo'
  #   repoId = 'your-repo-id'
  #   category = 'Announcements'
  #   categoryId = 'your-category-id'
  #   mapping = 'pathname'
  #   reactionsEnabled = 1
  #   emitMetadata = 0
  #   inputPosition = 'top'
  #   theme = 'preferred_color_scheme'
  #   lang = 'zh-CN'

[params.homeInfoParams]
  Title = '你好，欢迎来到我的博客 👋'
  Content = '这里记录我的学习和生活'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/'

[[params.socialIcons]]
  name = 'email'
  url = 'mailto:your@email.com'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 30
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# 启用评论
[taxonomies]
  tag = 'tags'
  category = 'categories'
