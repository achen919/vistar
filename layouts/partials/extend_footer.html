{{- if .Site.Params.siteStats -}}
<script defer src="/js/site-stats.js"></script>
<style>
.site-stats-footer {
  color: var(--secondary);
  font-size: 0.9em;
  margin-top: 20px;
  text-align: center;
}
</style>
<div class="site-stats-footer" data-site-stats hidden aria-live="polite">
  <span>日志范围访问量 <span data-site-pv>—</span> 次</span>
  <span aria-hidden="true" style="margin: 0 10px;">|</span>
  <span>访客数 <span data-site-uv>—</span> 人</span>
</div>
{{- end -}}
