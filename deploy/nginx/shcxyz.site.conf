server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shcxyz.site www.shcxyz.site _;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/blog/public;
        default_type text/plain;
    }

    location / {
        return 301 https://shcxyz.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shcxyz.site www.shcxyz.site;

    root /www/wwwroot/blog/public;
    index index.html;

    access_log /www/wwwlogs/blog.log;
    error_log /www/wwwlogs/blog.error.log;

    ssl_certificate /etc/nginx/ssl/shcxyz.site/shcxyz.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/shcxyz.site/shcxyz.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

