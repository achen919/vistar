limit_req_zone $binary_remote_addr zone=blog_request_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=blog_login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=blog_conn_limit:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shcxyz.site www.shcxyz.site _;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/blog/public;
        default_type text/plain;
    }

    location / {
        limit_req zone=blog_request_limit burst=20 nodelay;
        limit_conn blog_conn_limit 20;
        return 301 https://shcxyz.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shcxyz.site www.shcxyz.site;
    server_tokens off;
    client_max_body_size 2m;

    root /www/wwwroot/blog/public;
    index index.html;

    access_log /www/wwwlogs/blog.log;
    error_log /www/wwwlogs/blog.error.log;

    ssl_certificate /etc/nginx/ssl/shcxyz.site/shcxyz.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/shcxyz.site/shcxyz.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req_status 429;
    limit_req zone=blog_request_limit burst=40 nodelay;
    limit_conn blog_conn_limit 20;

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/api/login {
        access_log off;
        limit_req zone=blog_login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:18080/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 30s;
    }

    location = /admin/api/login/ {
        access_log off;
        return 308 /admin/api/login;
    }

    location ^~ /admin/api/ {
        access_log off;
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 30s;
    }

    location ^~ /admin/ {
        access_log off;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /analytics/summary {
        access_log off;
        limit_req zone=blog_request_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080/analytics/summary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
