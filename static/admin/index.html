<!doctype html>
<html lang="zh-CN" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light" />
    <title>博客管理后台 | 阿辰的博客</title>
    <link rel="icon" type="image/svg+xml" href="/icons/chen-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/chen-mark-32.png" />
    <link rel="apple-touch-icon" href="/icons/chen-mark-180.png" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="stylesheet" href="/admin/styles.css?v=20260728-console-4" />
    <link rel="modulepreload" href="/admin/api.js?v=20260728-console-4" />
    <link rel="modulepreload" href="/admin/ui.js?v=20260728-console-4" />
    <script src="/admin/boot.js?v=20260728-console-4"></script>
  </head>
  <body>
    <div id="app" class="app-root" aria-live="polite">
      <noscript>
        <main class="boot-screen">
          <div class="brand-mark" aria-hidden="true">辰</div>
          <h1>需要启用 JavaScript</h1>
          <p>管理后台依赖 JavaScript，请启用后重新加载页面。</p>
        </main>
      </noscript>
      <div class="boot-screen js-boot-screen">
        <div class="brand-mark" aria-hidden="true">辰</div>
        <p>正在验证管理会话…</p>
      </div>
    </div>

    <dialog id="globalConfirmDialog" class="dialog dialog-sm" aria-labelledby="confirmDialogTitle">
      <form method="dialog" class="dialog-card">
        <div class="dialog-icon" data-dialog-icon aria-hidden="true">!</div>
        <div class="dialog-copy">
          <h2 id="confirmDialogTitle">确认操作</h2>
          <p data-dialog-message></p>
        </div>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="button button-secondary">取消</button>
          <button type="submit" value="confirm" class="button button-danger" data-dialog-confirm>确认</button>
        </div>
      </form>
    </dialog>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/admin/admin.js?v=20260728-console-4"></script>
  </body>
</html>
