name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-blog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install admin Python dependencies
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/blog-admin-venv"
          "$RUNNER_TEMP/blog-admin-venv/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --requirement requirements-admin.txt
          printf '%s\n' "$RUNNER_TEMP/blog-admin-venv/bin" >> "$GITHUB_PATH"

      - name: Validate admin code before deployment
        run: |
          set -euo pipefail

          while IFS= read -r -d '' javascript_file; do
          node --check "$javascript_file"
          done < <(find static/admin -type f -name '*.js' -print0)
          python3 -c 'from pathlib import Path; path = Path("deploy/todo-state-snapshot.py"); compile(path.read_text(encoding="utf-8"), str(path), "exec")'
          node --experimental-vm-modules scripts/check-admin-modules.mjs
          event_name="${{ github.event_name }}"
          event_before="${{ github.event.before }}"
          asset_base_ref=""
          if [[ "$event_name" == "push" ]]; then
            if [[ "$event_before" =~ ^0{40}$ ]]; then
              asset_base_ref=""
            elif [[ "$event_before" =~ ^[0-9a-fA-F]{40}$ ]]; then
              if ! git cat-file -e "${event_before}^{commit}" 2>/dev/null; then
                echo "Unable to inspect the pre-push commit for asset validation." >&2
                exit 1
              fi
              asset_base_ref="$event_before"
            else
              echo "Push event has an invalid pre-push commit." >&2
              exit 1
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            asset_base_ref="HEAD^"
          fi
          if \
            [[ -n "$asset_base_ref" ]] \
            && git cat-file -e "$asset_base_ref:static/admin/version.json" 2>/dev/null; then
            cacheable_admin_changes="$(
              git diff --name-only "$asset_base_ref" HEAD -- static/admin \
                | grep -E '\.(css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$' \
                || true
            )"
            if [[ -n "$cacheable_admin_changes" ]]; then
              previous_asset_version="$(
                git show "$asset_base_ref:static/admin/version.json" \
                  | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])'
              )"
              current_asset_version="$(
                python3 -c 'import json; print(json.load(open("static/admin/version.json"))["version"])'
              )"
              if [[ "$previous_asset_version" == "$current_asset_version" ]]; then
                echo "Admin cacheable assets changed without an asset version bump:" >&2
                printf '%s\n' "$cacheable_admin_changes" >&2
                exit 1
              fi
            fi
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          bash -n deploy/install-blog-admin.sh scripts/validate-blog-config.sh

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Configure SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_HOST_KEY:?Missing DEPLOY_HOST_KEY secret}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Sync source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PASSWORD:?Missing DEPLOY_PASSWORD secret}"

          EXPECTED_REMOTE_PATH="/www/wwwroot/blog"
          REMOTE_PATH="${DEPLOY_PATH:-$EXPECTED_REMOTE_PATH}"
          if [[ "$REMOTE_PATH" != "$EXPECTED_REMOTE_PATH" ]]; then
            echo "DEPLOY_PATH must remain $EXPECTED_REMOTE_PATH" >&2
            exit 1
          fi
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          RELEASE_ID="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SOURCE_BACKUP="/www/wwwroot/blog-source-rollbacks/$RELEASE_ID"

          $SSH_CMD "$REMOTE" sh -s -- \
            "$REMOTE_PATH" \
            "$SOURCE_BACKUP" <<'BACKUP_SCRIPT'
          set -eu

          deploy_path="$1"
          source_backup="$2"
          if [ -L "$deploy_path" ]; then
            echo "Refusing symbolic-link deployment path: $deploy_path" >&2
            exit 1
          fi
          mkdir -p "$deploy_path" "$(dirname "$source_backup")"
          test -d "$deploy_path"
          if [ -e "$source_backup" ] || [ -L "$source_backup" ]; then
            echo "Source rollback path already exists: $source_backup" >&2
            exit 1
          fi
          mkdir "$source_backup"
          rsync -a \
            --exclude '.git' \
            --exclude '/public' \
            --exclude 'resources/_gen/' \
            "$deploy_path/" \
            "$source_backup/"
          BACKUP_SCRIPT

          if ! rsync -az --delete \
              --exclude '.git' \
              --exclude '.github/' \
              --exclude '.DS_Store' \
              --exclude '.hugo_build.lock' \
              --exclude '/public' \
              --exclude 'resources/_gen/' \
              -e "$SSH_CMD" \
              ./ "$REMOTE:$REMOTE_PATH/"; then
            $SSH_CMD "$REMOTE" sh -s -- \
              "$REMOTE_PATH" \
              "$SOURCE_BACKUP" <<'RESTORE_SCRIPT'
          set -eu
          deploy_path="$1"
          source_backup="$2"
          test -d "$source_backup"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '/public' \
            --exclude 'resources/_gen/' \
            "$source_backup/" \
            "$deploy_path/"
          RESTORE_SCRIPT
            exit 1
          fi

      - name: Build and activate site on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          EXPECTED_REMOTE_PATH="/www/wwwroot/blog"
          REMOTE_PATH="${DEPLOY_PATH:-$EXPECTED_REMOTE_PATH}"
          if [[ "$REMOTE_PATH" != "$EXPECTED_REMOTE_PATH" ]]; then
            echo "DEPLOY_PATH must remain $EXPECTED_REMOTE_PATH" >&2
            exit 1
          fi
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          $SSH_CMD "$REMOTE" sh -s -- \
            "$REMOTE_PATH" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" <<'REMOTE_SCRIPT'
          set -eu

          deploy_path="$1"
          release_id="$2-$3-$4"
          release_root="/www/wwwroot/blog-public-releases"
          release_path="$release_root/$release_id"
          next_link="$deploy_path/.public-next-$release_id"
          current_path="$deploy_path/public"
          rollback_marker="$release_root/.previous-$release_id"
          source_backup="/www/wwwroot/blog-source-rollbacks/$release_id"
          nginx_config="/www/server/panel/vhost/nginx/blog.conf"
          nginx_backup="${nginx_config}.rollback-${release_id}.bak"
          nginx_restore_temp="${nginx_config}.restore-${release_id}.tmp"
          nginx_backup_ready=0
          todo_snapshot_tool="$deploy_path/deploy/todo-state-snapshot.py"
          todo_backup_ready=0
          nginx_bin=""
          service_installed=0

          if systemctl list-unit-files blog-admin.service >/dev/null 2>&1; then
            service_installed=1
          fi
          wait_for_admin() {
            attempt=1
            while [ "$attempt" -le 30 ]; do
              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 2 \
                http://127.0.0.1:18080/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            return 1
          }
          require_admin_python_dependencies() {
            python3 - <<'PILLOW_CHECK'
          from PIL import features

          required = ("jpg", "zlib", "webp")
          missing = [name for name in required if not features.check(name)]
          if missing:
              raise SystemExit(
                  "Pillow is missing required codecs: " + ", ".join(missing)
              )
          PILLOW_CHECK
          }
          migrate_admin_stats_cache_ttl() {
            python3 - <<'ENV_MIGRATION'
          import os
          import re
          import stat
          import tempfile
          from pathlib import Path

          path = Path("/etc/blog-admin.env")
          file_stat = os.lstat(path)
          if stat.S_ISLNK(file_stat.st_mode) or not stat.S_ISREG(file_stat.st_mode):
              raise SystemExit("Admin environment must be a non-symlink regular file")

          source = path.read_text(encoding="utf-8")
          pattern = re.compile(r"^BLOG_ADMIN_STATS_CACHE_SECONDS=(.*)$", re.MULTILINE)
          matches = pattern.findall(source)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one admin stats cache setting")
          if matches[0] == "300":
              raise SystemExit(0)
          if matches[0] != "60":
              print("Preserving custom admin stats cache TTL")
              raise SystemExit(0)

          updated = pattern.sub("BLOG_ADMIN_STATS_CACHE_SECONDS=300", source, count=1)
          descriptor, temporary_name = tempfile.mkstemp(
              dir=path.parent,
              prefix=".blog-admin.env.migrate-",
          )
          try:
              os.fchmod(descriptor, stat.S_IMODE(file_stat.st_mode))
              os.fchown(descriptor, file_stat.st_uid, file_stat.st_gid)
              with os.fdopen(descriptor, "w", encoding="utf-8") as temporary:
                  temporary.write(updated)
                  temporary.flush()
                  os.fsync(temporary.fileno())
              descriptor = -1
              os.replace(temporary_name, path)
              directory_descriptor = os.open(path.parent, os.O_DIRECTORY)
              try:
                  os.fsync(directory_descriptor)
              finally:
                  os.close(directory_descriptor)
          finally:
              if descriptor >= 0:
                  os.close(descriptor)
              try:
                  os.unlink(temporary_name)
              except FileNotFoundError:
                  pass
          ENV_MIGRATION
          }
          resolve_nginx_bin() {
            if [ -x /www/server/nginx/sbin/nginx ]; then
              nginx_bin="/www/server/nginx/sbin/nginx"
              return 0
            fi
            nginx_bin="$(command -v nginx || true)"
            if [ -z "$nginx_bin" ] || [ ! -x "$nginx_bin" ]; then
              echo "Unable to locate the active Nginx executable." >&2
              return 1
            fi
          }
          restore_nginx_config() {
            if [ "$nginx_backup_ready" -ne 1 ]; then
              return 0
            fi
            if \
              [ ! -f "$nginx_config" ] \
              || [ -L "$nginx_config" ] \
              || [ ! -f "$nginx_backup" ] \
              || [ -L "$nginx_backup" ]; then
              echo "Refusing to restore an unsafe Nginx config or backup." >&2
              return 1
            fi
            if [ -e "$nginx_restore_temp" ] || [ -L "$nginx_restore_temp" ]; then
              echo "Nginx restore path already exists: $nginx_restore_temp" >&2
              return 1
            fi
            if ! cp -p "$nginx_backup" "$nginx_restore_temp"; then
              return 1
            fi
            if [ ! -f "$nginx_restore_temp" ] || [ -L "$nginx_restore_temp" ]; then
              echo "Nginx restore copy is not a regular file." >&2
              return 1
            fi
            if ! mv -f "$nginx_restore_temp" "$nginx_config"; then
              return 1
            fi
            if [ ! -f "$nginx_config" ] || [ -L "$nginx_config" ]; then
              echo "Restored Nginx config is not a regular file." >&2
              return 1
            fi
            if ! "$nginx_bin" -t; then
              return 1
            fi
            "$nginx_bin" -s reload
          }
          backup_todo_state() {
            test -f "$todo_snapshot_tool"
            python3 "$todo_snapshot_tool" backup "$release_id"
            todo_backup_ready=1
          }
          restore_todo_state() {
            if [ "$todo_backup_ready" -ne 1 ]; then
              return 0
            fi
            python3 "$todo_snapshot_tool" restore "$release_id"
          }
          rollback_source_on_error() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              set +e
              nginx_rollback_failed=0
              backend_rollback_safe=1
              if ! restore_nginx_config; then
                nginx_rollback_failed=1
              fi
              if [ "$service_installed" -eq 1 ]; then
                if ! systemctl stop blog-admin.service; then
                  backend_rollback_safe=0
                  echo "Unable to stop the admin service; preserving the new backend and Todo state." >&2
                elif systemctl is-active --quiet blog-admin.service; then
                  backend_rollback_safe=0
                  echo "Admin service is still active; preserving the new backend and Todo state." >&2
                fi
              fi
              if [ "$backend_rollback_safe" -eq 1 ] && ! restore_todo_state; then
                backend_rollback_safe=0
                echo "Todo state rollback failed; manual recovery is required." >&2
              fi
              if [ "$backend_rollback_safe" -eq 1 ] && [ -d "$source_backup" ]; then
                rsync -a --delete \
                  --exclude '.git' \
                  --exclude '/public' \
                  --exclude 'resources/_gen/' \
                  "$source_backup/" \
                  "$deploy_path/"
              elif [ "$backend_rollback_safe" -ne 1 ]; then
                echo "Skipped backend source rollback to keep the active Todo schema compatible." >&2
              fi
              if [ "$service_installed" -eq 1 ]; then
                systemctl restart blog-admin.service
                wait_for_admin
              fi
              if [ "$nginx_rollback_failed" -ne 0 ]; then
                echo "Nginx config rollback failed; manual recovery is required." >&2
              fi
              set -e
            fi
            exit "$status"
          }
          trap rollback_source_on_error EXIT

          umask 022
          test -d "$source_backup"
          mkdir -p "$release_root"
          if [ -e "$release_path" ] || [ -L "$release_path" ]; then
            echo "Release path already exists: $release_path" >&2
            exit 1
          fi
          if [ -e "$next_link" ] || [ -L "$next_link" ]; then
            echo "Temporary public link already exists: $next_link" >&2
            exit 1
          fi
          if [ -e "$rollback_marker" ] || [ -L "$rollback_marker" ]; then
            echo "Rollback marker already exists: $rollback_marker" >&2
            exit 1
          fi

          hugo \
            --source "$deploy_path" \
            --gc \
            --minify \
            --destination "$release_path"

          for required_asset in \
            admin/index.html \
            admin/version.json \
            admin/styles.css \
            admin/boot.js \
            admin/admin.js \
            admin/api.js \
            admin/ui.js \
            admin/pages/dashboard.js \
            admin/pages/articles.js \
            admin/pages/editor.js \
            admin/pages/categories.js \
            admin/pages/todos.js \
            admin/pages/analytics.js \
            icons/chen-mark.svg \
            icons/chen-mark-16.png \
            icons/chen-mark-32.png \
            icons/chen-mark-180.png \
            icons/chen-mask.svg; do
            test -f "$release_path/$required_asset"
          done

          if [ "$service_installed" -eq 1 ]; then
            backup_todo_state
            require_admin_python_dependencies
            migrate_admin_stats_cache_ttl
            systemctl restart blog-admin.service
            systemctl is-active --quiet blog-admin.service
            wait_for_admin
          fi

          case "$release_id" in
            *[!A-Za-z0-9._-]* | "")
              echo "Unsafe release identifier for Nginx backup: $release_id" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$nginx_config" ] || [ -L "$nginx_config" ]; then
            echo "Refusing non-regular or symbolic-link Nginx config: $nginx_config" >&2
            exit 1
          fi
          if [ -e "$nginx_backup" ] || [ -L "$nginx_backup" ]; then
            echo "Nginx rollback backup already exists: $nginx_backup" >&2
            exit 1
          fi
          if [ -e "$nginx_restore_temp" ] || [ -L "$nginx_restore_temp" ]; then
            echo "Nginx restore path already exists: $nginx_restore_temp" >&2
            exit 1
          fi
          resolve_nginx_bin
          cp -p "$nginx_config" "$nginx_backup"
          if [ ! -f "$nginx_backup" ] || [ -L "$nginx_backup" ]; then
            echo "Nginx rollback backup is not a regular file." >&2
            exit 1
          fi
          nginx_backup_ready=1

          nginx_patch_result="$(
            python3 - "$nginx_config" <<'PY'
          import os
          import stat
          import sys
          import tempfile
          from pathlib import Path

          path = Path(sys.argv[1])
          file_stat = os.lstat(path)
          if stat.S_ISLNK(file_stat.st_mode) or not stat.S_ISREG(file_stat.st_mode):
              raise SystemExit("Active Nginx config must be a non-symlink regular file")

          source = path.read_text(encoding="utf-8")
          api_location = "    location ^~ /admin/api/ {\n"
          api_before = (
              "    location ^~ /admin/api/ {\n"
              "        access_log off;\n"
              "        proxy_pass http://127.0.0.1:18080/api/;\n"
          )
          api_after = (
              "    location ^~ /admin/api/ {\n"
              "        access_log off;\n"
              "        client_max_body_size 8m;\n"
              "        proxy_pass http://127.0.0.1:18080/api/;\n"
          )
          csp_before = (
              "        add_header Content-Security-Policy "
              "\"default-src 'self'; script-src 'self'; style-src 'self'; "
              "img-src 'self' data:; connect-src 'self'; object-src 'none'; "
              "base-uri 'none'; frame-ancestors 'none'; form-action 'self'\" always;"
          )
          csp_after = (
              "        add_header Content-Security-Policy "
              "\"default-src 'self'; script-src 'self'; style-src 'self'; "
              "img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; "
              "base-uri 'none'; frame-ancestors 'none'; form-action 'self'\" always;"
          )
          asset_cache_before = (
              "    location ~* ^/admin/.*\\.(?:css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n"
              "        access_log off;\n"
              "        try_files $uri =404;\n"
              "        add_header Cache-Control \"no-store\" always;\n"
          )
          asset_cache_after = (
              "    location ~* ^/admin/.*\\.(?:css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n"
              "        access_log off;\n"
              "        try_files $uri =404;\n"
              "        add_header Cache-Control \"public, max-age=31536000, immutable\";\n"
          )

          if source.count(api_location) != 1:
              raise SystemExit("Expected exactly one /admin/api/ location")
          api_before_count = source.count(api_before)
          api_after_count = source.count(api_after)
          if (api_before_count, api_after_count) == (1, 0):
              updated = source.replace(api_before, api_after, 1)
          elif (api_before_count, api_after_count) == (0, 1):
              updated = source
          else:
              raise SystemExit("Unexpected /admin/api/ location shape")

          if source.count("add_header Content-Security-Policy ") != 2:
              raise SystemExit("Expected exactly two admin CSP directives")
          csp_before_count = updated.count(csp_before)
          csp_after_count = updated.count(csp_after)
          if (csp_before_count, csp_after_count) == (2, 0):
              updated = updated.replace(csp_before, csp_after)
          elif (csp_before_count, csp_after_count) != (0, 2):
              raise SystemExit("Unexpected admin CSP directive shape")

          asset_cache_before_count = updated.count(asset_cache_before)
          asset_cache_after_count = updated.count(asset_cache_after)
          if (asset_cache_before_count, asset_cache_after_count) == (1, 0):
              updated = updated.replace(asset_cache_before, asset_cache_after, 1)
          elif (asset_cache_before_count, asset_cache_after_count) != (0, 1):
              raise SystemExit("Unexpected admin asset cache directive shape")

          if updated == source:
              print("unchanged")
              raise SystemExit(0)

          descriptor, temporary_name = tempfile.mkstemp(
              dir=path.parent,
              prefix=".blog.conf.patch-",
          )
          try:
              os.fchmod(descriptor, stat.S_IMODE(file_stat.st_mode))
              os.fchown(descriptor, file_stat.st_uid, file_stat.st_gid)
              with os.fdopen(descriptor, "w", encoding="utf-8") as temporary:
                  temporary.write(updated)
                  temporary.flush()
                  os.fsync(temporary.fileno())
              descriptor = -1
              os.replace(temporary_name, path)
              directory_descriptor = os.open(path.parent, os.O_DIRECTORY)
              try:
                  os.fsync(directory_descriptor)
              finally:
                  os.close(directory_descriptor)
          finally:
              if descriptor >= 0:
                  os.close(descriptor)
              try:
                  os.unlink(temporary_name)
              except FileNotFoundError:
                  pass
          print("changed")
          PY
          )"
          case "$nginx_patch_result" in
            changed | unchanged) ;;
            *)
              echo "Unexpected Nginx patch result." >&2
              exit 1
              ;;
          esac
          if [ ! -f "$nginx_config" ] || [ -L "$nginx_config" ]; then
            echo "Patched Nginx config is not a regular file." >&2
            exit 1
          fi
          "$nginx_bin" -t
          if [ "$nginx_patch_result" = "changed" ]; then
            "$nginx_bin" -s reload
          fi

          ln -s "$release_path" "$next_link"
          previous_target=""
          if [ -e "$current_path" ] && [ ! -L "$current_path" ]; then
            legacy_path="$release_root/legacy-$release_id"
            if [ -e "$legacy_path" ] || [ -L "$legacy_path" ]; then
              echo "Legacy public backup already exists: $legacy_path" >&2
              exit 1
            fi
            previous_target="$legacy_path"
          elif [ -L "$current_path" ]; then
            previous_target="$(readlink -f "$current_path")"
            test -d "$previous_target"
          fi
          printf '%s\n' "$previous_target" > "$rollback_marker"
          chmod 600 "$rollback_marker"

          if [ -n "${legacy_path:-}" ]; then
            mv "$current_path" "$legacy_path"
          fi
          if ! mv -Tf "$next_link" "$current_path"; then
            if [ -n "${legacy_path:-}" ] && [ ! -e "$current_path" ]; then
              mv "$legacy_path" "$current_path"
            fi
            exit 1
          fi
          if \
            [ ! -L "$current_path" ] \
            || [ "$(readlink -f "$current_path")" != "$release_path" ]; then
            if [ -n "$previous_target" ] && [ -d "$previous_target" ]; then
              restore_link="$deploy_path/.public-activate-rollback-$release_id"
              ln -s "$previous_target" "$restore_link"
              mv -Tf "$restore_link" "$current_path"
            fi
            exit 1
          fi
          nginx_backup_ready=0
          trap - EXIT
          REMOTE_SCRIPT

      - name: Verify production site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          EXPECTED_REMOTE_PATH="/www/wwwroot/blog"
          REMOTE_PATH="${DEPLOY_PATH:-$EXPECTED_REMOTE_PATH}"
          if [[ "$REMOTE_PATH" != "$EXPECTED_REMOTE_PATH" ]]; then
            echo "DEPLOY_PATH must remain $EXPECTED_REMOTE_PATH" >&2
            exit 1
          fi
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PASSWORD:?Missing DEPLOY_PASSWORD secret}"

          export SSHPASS="$DEPLOY_PASSWORD"
          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          set +e
          (
          set -euo pipefail

          curl --fail --head --max-time 20 https://shcxyz.site/

          ADMIN_HEADERS="$RUNNER_TEMP/admin-headers.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --dump-header "$ADMIN_HEADERS" \
            --output /dev/null \
            https://shcxyz.site/admin/
          if grep -Eiq '^www-authenticate:' "$ADMIN_HEADERS"; then
            echo "Legacy HTTP Basic Auth is still active on /admin/." >&2
            exit 1
          fi
          if ! grep -Eiq \
              "^content-security-policy:.*img-src 'self' data: blob:;" \
              "$ADMIN_HEADERS"; then
            echo "Admin HTML CSP does not allow local image previews." >&2
            exit 1
          fi

          ADMIN_ASSET_HEADERS="$RUNNER_TEMP/admin-asset-headers.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --dump-header "$ADMIN_ASSET_HEADERS" \
            --output /dev/null \
            https://shcxyz.site/admin/admin.js
          if ! grep -Eiq \
              "^content-security-policy:.*img-src 'self' data: blob:;" \
              "$ADMIN_ASSET_HEADERS"; then
            echo "Admin asset CSP does not allow local image previews." >&2
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://shcxyz.site/analytics/summary |
            python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          assert set(payload) == {"pv", "uv"}
          assert all(isinstance(payload[key], int) for key in ("pv", "uv"))
          '

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://shcxyz.site/admin/api/session |
            python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          assert payload.get("authenticated") is False
          '

          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import urllib.parse
          import urllib.request

          class ModuleEntryParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.entries = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if (
                      tag == "script"
                      and attributes.get("type") == "module"
                      and attributes.get("src")
                  ):
                      self.entries.append(attributes["src"])

          index_url = "https://shcxyz.site/admin/"
          with urllib.request.urlopen(index_url, timeout=20) as response:
              assert "no-store" in response.headers.get("Cache-Control", "")
              parser = ModuleEntryParser()
              parser.feed(response.read().decode("utf-8"))
          assert len(parser.entries) == 1, parser.entries

          seen = set()
          pending = [urllib.parse.urljoin(index_url, parser.entries[0])]
          import_pattern = re.compile(
              r"""(?:from\s*|import\s*\()\s*["']([^"']+)["']"""
          )

          while pending:
              url = pending.pop()
              if url in seen:
                  continue
              seen.add(url)
              parsed = urllib.parse.urlparse(url)
              assert parsed.netloc == "shcxyz.site", url
              assert parsed.path.startswith("/admin/"), url
              with urllib.request.urlopen(url, timeout=20) as response:
                  content_type = response.headers.get_content_type()
                  assert response.status == 200, (url, response.status)
                  assert content_type in {
                      "application/javascript",
                      "text/javascript",
                  }, (url, content_type)
                  cache_control = response.headers.get("Cache-Control", "")
                  assert "max-age=31536000" in cache_control, (url, cache_control)
                  assert "immutable" in cache_control, (url, cache_control)
                  source = response.read().decode("utf-8")
              for specifier in import_pattern.findall(source):
                  pending.append(urllib.parse.urljoin(url, specifier))

          assert any(
              urllib.parse.urlparse(url).path == "/admin/admin.js"
              for url in seen
          ), seen
          PY

          MISSING_MODULE_STATUS="$(
            curl \
              --silent \
              --show-error \
              --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              https://shcxyz.site/admin/pages/__missing_module_probe__.js
          )"
          test "$MISSING_MODULE_STATUS" = "404"

          $SSH_CMD "$REMOTE" sh -s <<'VERIFY_NGINX_SCRIPT'
          set -eu

          nginx_config="/www/server/panel/vhost/nginx/blog.conf"
          if [ ! -f "$nginx_config" ] || [ -L "$nginx_config" ]; then
            echo "Active Nginx config is not a non-symlink regular file." >&2
            exit 1
          fi
          python3 - "$nginx_config" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          file_stat = os.lstat(path)
          if stat.S_ISLNK(file_stat.st_mode) or not stat.S_ISREG(file_stat.st_mode):
              raise SystemExit("Active Nginx config must be a regular file")

          source = path.read_text(encoding="utf-8")
          api_after = (
              "    location ^~ /admin/api/ {\n"
              "        access_log off;\n"
              "        client_max_body_size 8m;\n"
              "        proxy_pass http://127.0.0.1:18080/api/;\n"
          )
          csp_after = (
              "        add_header Content-Security-Policy "
              "\"default-src 'self'; script-src 'self'; style-src 'self'; "
              "img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; "
              "base-uri 'none'; frame-ancestors 'none'; form-action 'self'\" always;"
          )
          asset_cache_after = (
              "    location ~* ^/admin/.*\\.(?:css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n"
              "        access_log off;\n"
              "        try_files $uri =404;\n"
              "        add_header Cache-Control \"public, max-age=31536000, immutable\";\n"
          )
          if source.count("    location ^~ /admin/api/ {\n") != 1:
              raise SystemExit("Unexpected /admin/api/ location count")
          if source.count(api_after) != 1:
              raise SystemExit("Active /admin/api/ body limit is not 8m")
          if source.count("add_header Content-Security-Policy ") != 2:
              raise SystemExit("Unexpected admin CSP count")
          if source.count(csp_after) != 2:
              raise SystemExit("Active admin CSP does not allow blob images")
          if source.count(asset_cache_after) != 1:
              raise SystemExit("Active admin assets are not immutable")
          PY
          VERIFY_NGINX_SCRIPT
          )
          verification_status=$?
          set -e

          if [[ "$verification_status" -eq 0 ]]; then
            exit 0
          fi

          $SSH_CMD "$REMOTE" sh -s -- \
            "$REMOTE_PATH" \
            "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'ROLLBACK_SCRIPT'
          set -eu

          deploy_path="$1"
          release_id="$2"
          release_root="/www/wwwroot/blog-public-releases"
          rollback_marker="$release_root/.previous-$release_id"
          current_path="$deploy_path/public"
          rollback_link="$deploy_path/.public-rollback-$release_id"
          source_backup="/www/wwwroot/blog-source-rollbacks/$release_id"
          nginx_config="/www/server/panel/vhost/nginx/blog.conf"
          nginx_backup="${nginx_config}.rollback-${release_id}.bak"
          nginx_restore_temp="${nginx_config}.verify-restore-${release_id}.tmp"
          todo_snapshot_tool="$deploy_path/deploy/todo-state-snapshot.py"
          nginx_bin=""
          service_installed=0
          service_stopped=0
          wait_for_admin() {
            attempt=1
            while [ "$attempt" -le 30 ]; do
              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 2 \
                http://127.0.0.1:18080/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
            return 1
          }
          resolve_nginx_bin() {
            if [ -x /www/server/nginx/sbin/nginx ]; then
              nginx_bin="/www/server/nginx/sbin/nginx"
              return 0
            fi
            nginx_bin="$(command -v nginx || true)"
            if [ -z "$nginx_bin" ] || [ ! -x "$nginx_bin" ]; then
              echo "Unable to locate the active Nginx executable." >&2
              return 1
            fi
          }
          restore_nginx_config() {
            if \
              [ ! -f "$nginx_config" ] \
              || [ -L "$nginx_config" ] \
              || [ ! -f "$nginx_backup" ] \
              || [ -L "$nginx_backup" ]; then
              echo "Refusing to restore an unsafe Nginx config or backup." >&2
              return 1
            fi
            if [ -e "$nginx_restore_temp" ] || [ -L "$nginx_restore_temp" ]; then
              echo "Nginx verify rollback path already exists: $nginx_restore_temp" >&2
              return 1
            fi
            cp -p "$nginx_backup" "$nginx_restore_temp"
            if [ ! -f "$nginx_restore_temp" ] || [ -L "$nginx_restore_temp" ]; then
              echo "Nginx verify rollback copy is not a regular file." >&2
              return 1
            fi
            mv -f "$nginx_restore_temp" "$nginx_config"
            if [ ! -f "$nginx_config" ] || [ -L "$nginx_config" ]; then
              echo "Restored Nginx config is not a regular file." >&2
              return 1
            fi
            resolve_nginx_bin
            "$nginx_bin" -t
            "$nginx_bin" -s reload
          }
          restart_service_on_error() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$service_stopped" -eq 1 ]; then
              set +e
              systemctl restart blog-admin.service
              wait_for_admin
              set -e
            fi
            exit "$status"
          }
          trap restart_service_on_error EXIT

          if systemctl list-unit-files blog-admin.service >/dev/null 2>&1; then
            service_installed=1
            test -f "$todo_snapshot_tool"
          fi

          test -f "$rollback_marker"
          previous_target="$(sed -n '1p' "$rollback_marker")"
          case "$previous_target" in
            "$release_root"/*) ;;
            *)
              echo "Unsafe or missing public rollback target: $previous_target" >&2
              exit 1
              ;;
          esac
          test -d "$previous_target"
          test -d "$source_backup"
          if [ -e "$rollback_link" ] || [ -L "$rollback_link" ]; then
            echo "Rollback link already exists: $rollback_link" >&2
            exit 1
          fi
          ln -s "$previous_target" "$rollback_link"
          mv -Tf "$rollback_link" "$current_path"
          test "$(readlink -f "$current_path")" = "$previous_target"
          if [ "$service_installed" -eq 1 ]; then
            systemctl stop blog-admin.service
            service_stopped=1
            python3 "$todo_snapshot_tool" restore "$release_id"
          fi
          rsync -a --delete \
            --exclude '.git' \
            --exclude '/public' \
            --exclude 'resources/_gen/' \
            "$source_backup/" \
            "$deploy_path/"
          restore_nginx_config
          if [ "$service_installed" -eq 1 ]; then
            systemctl restart blog-admin.service
            systemctl is-active --quiet blog-admin.service
            wait_for_admin
            service_stopped=0
          fi
          trap - EXIT
          ROLLBACK_SCRIPT

          echo "Production verification failed; restored the previous public release." >&2
          exit "$verification_status"
