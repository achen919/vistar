name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-blog-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Configure SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_HOST_KEY:?Missing DEPLOY_HOST_KEY secret}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Sync source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PASSWORD:?Missing DEPLOY_PASSWORD secret}"

          REMOTE_PATH="${DEPLOY_PATH:-/www/wwwroot/blog}"
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          $SSH_CMD "$REMOTE" "mkdir -p $(printf '%q' "$REMOTE_PATH")"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude '.hugo_build.lock' \
            --exclude 'public/' \
            --exclude 'resources/_gen/' \
            -e "$SSH_CMD" \
            ./ "$REMOTE:$REMOTE_PATH/"

      - name: Build site on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          REMOTE_PATH="${DEPLOY_PATH:-/www/wwwroot/blog}"
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          REMOTE_COMMAND="cd $(printf '%q' "$REMOTE_PATH") && hugo --gc --minify"

          $SSH_CMD "$REMOTE" "$REMOTE_COMMAND"

      - name: Restart blog admin service when installed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail

          export SSHPASS="$DEPLOY_PASSWORD"
          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          $SSH_CMD "$REMOTE" "if systemctl list-unit-files blog-admin.service >/dev/null 2>&1; then systemctl restart blog-admin.service; fi"

      - name: Verify production site
        run: |
          curl --fail --head --max-time 20 https://shcxyz.site/
