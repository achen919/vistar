name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-blog-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Sync source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PASSWORD:?Missing DEPLOY_PASSWORD secret}"

          REMOTE_PATH="${DEPLOY_PATH:-/www/wwwroot/blog}"
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          $SSH_CMD "$REMOTE" "mkdir -p $(printf '%q' "$REMOTE_PATH")"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude '.hugo_build.lock' \
            --exclude 'public/' \
            --exclude 'resources/_gen/' \
            -e "$SSH_CMD" \
            ./ "$REMOTE:$REMOTE_PATH/"

      - name: Build site on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          REMOTE_PATH="${DEPLOY_PATH:-/www/wwwroot/blog}"
          export SSHPASS="$DEPLOY_PASSWORD"

          SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          REMOTE_COMMAND="cd $(printf '%q' "$REMOTE_PATH") && hugo --gc --minify"

          $SSH_CMD "$REMOTE" "$REMOTE_COMMAND"

      - name: Verify production site
        run: |
          curl --fail --head --max-time 20 https://shcxyz.site/
